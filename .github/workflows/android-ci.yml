name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate full Quran content
        run: python3 scripts/generate_quran_content.py --output feature/quran/src/main/assets/quran_reader.json

      - name: Validate Quran content
        run: python3 scripts/validate_quran_content.py feature/quran/src/main/assets/quran_reader.json

      - name: Run unit tests
        run: gradle test

      - name: Run lint checks
        run: gradle lint

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-knowledge-platform-debug
          path: app/build/outputs/apk/debug/*.apk
