name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0-alpha01'
        required: true
        default: 'v0.2.0-alpha01'
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate full Quran content
        run: python3 scripts/generate_quran_content.py --output feature/quran/src/main/assets/quran_reader.json

      - name: Validate Quran content
        run: python3 scripts/validate_quran_content.py feature/quran/src/main/assets/quran_reader.json

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/islamic-knowledge-platform-debug.apk
          sha256sum release/islamic-knowledge-platform-debug.apk > release/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "$TAG" \
            release/islamic-knowledge-platform-debug.apk \
            release/SHA256SUMS.txt \
            --target main \
            --title "Islamic Knowledge Platform $TAG" \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease)
