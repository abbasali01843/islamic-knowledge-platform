name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0-alpha01'
        required: true
        default: 'v0.1.0-alpha01'
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/islamic-knowledge-platform-debug.apk
          sha256sum release/islamic-knowledge-platform-debug.apk > release/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "$TAG" \
            release/islamic-knowledge-platform-debug.apk \
            release/SHA256SUMS.txt \
            --target main \
            --title "Islamic Knowledge Platform $TAG" \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease)
